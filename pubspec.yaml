 name: ai_hub
  description: AI Hub — chat with free AI models through a
  local FreeLLMAPI gateway.
  version: 1.0.0
  publish_to: 'none'

  environment:
    sdk: '>=3.0.0 <4.0.0'

  dependencies:
    flutter:
      sdk: flutter
    provider: ^6.1.5
    http: ^1.6.0
    flutter_secure_storage: ^11.2.0
    sqflite: ^2.4.6
    path: ^1.9.1
    path_provider: ^2.1.6
    shared_preferences: ^2.5.6
    speech_to_text: ^7.5.0
    flutter_tts: ^4.2.5
    flutter_markdown: ^0.7.7
    flutter_colorpicker: ^1.1.0
    intl: ^0.20.3

  dev_dependencies:
    flutter_test:
      sdk: flutter
    flutter_lints: ^6.0.0

  flutter:
    uses-material-design: true
